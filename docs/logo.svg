<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Subtle Glow Ring -->
  <rect x="12" y="12" width="96" height="96" rx="21" fill="none" stroke="#3B82F6" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Monitor Screen -->
  <rect x="24" y="28" width="72" height="48" rx="9" fill="#0B1120" stroke="url(#accentGrad)" stroke-width="4"/>
  <!-- Screen Inner Content / Remote Signal Waves -->
  <circle cx="46" cy="52" r="5" fill="#60A5FA"/>
  <path d="M 56 44 A 12 12 0 0 1 56 60" fill="none" stroke="#60A5FA" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 63 38 A 20 20 0 0 1 63 66" fill="none" stroke="#3B82F6" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Monitor Stand -->
  <path d="M 52 76 L 48 88 L 72 88 L 68 76 Z" fill="#475569"/>
  <rect x="40" y="87" width="40" height="5" rx="2.5" fill="#64748B"/>

  <!-- Consent & mTLS Security Shield Badge (Bottom Right) -->
  <path d="M 85 56 L 101 62 V 74 C 101 84 94 91 85 95 C 76 91 69 84 69 74 V 62 Z"
        fill="url(#shieldGrad)" stroke="#0F172A" stroke-width="3"/>
  <path d="M 79 75 L 83.5 79.5 L 92 70.5" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
