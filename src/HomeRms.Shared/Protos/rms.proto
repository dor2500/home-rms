syntax = "proto3";

option csharp_namespace = "HomeRms.Shared.Protocol";

package homerms;

// Consent-based remote administration service.
// Every interactive-control RPC is gated by on-machine consent and a visible
// indicator in the agent's tray; see ConsentManager on the agent side.
service RemoteManagement {
  // --- Identity / handshake ---
  rpc GetAgentInfo (Empty) returns (AgentInfo);

  // --- Inventory (read-only, still surfaced in the agent's activity log) ---
  rpc GetInventory (Empty) returns (InventorySnapshot);

  // --- Remote shell: bidirectional stream. Each command the agent runs is
  // written to the visible activity log. ---
  rpc Shell (stream ShellInput) returns (stream ShellOutput);

  // --- Remote desktop: server-streamed frames. Starting a stream REQUIRES a
  // consent grant and raises the persistent "being viewed" banner. ---
  rpc StreamScreen (ScreenRequest) returns (stream ScreenFrame);

  // --- Input injection: client-streamed mouse/keyboard events. Only honored
  // while an active consent grant for control exists. ---
  rpc SendInput (stream InputEvent) returns (InputAck);

  // --- Silent software deployment: client-streams an installer (.exe / .msi / .ps1)
  // in chunks, executes it silently on the agent, and returns the result. ---
  rpc DeployPackage (stream PackageChunk) returns (DeployResult);

  // --- Terminate a running process by PID (recorded in the agent's audit log). ---
  rpc KillProcess (KillProcessRequest) returns (KillProcessResult);

  // --- Bidirectional clipboard sync (Copy/Paste between Controller and Agent). ---
  rpc GetClipboard (Empty) returns (ClipboardData);
  rpc SetClipboard (ClipboardData) returns (ClipboardAck);
  // Live remote->operator clipboard: a message every time text is copied on the remote PC (needs an active grant)
  rpc WatchClipboard (Empty) returns (stream ClipboardData);

  // --- System control: Windows Update, services, startup, scheduled tasks, power,
  // registry, firewall and general settings. Allowlisted actions only; every call is
  // written to the agent's audit log. ---
  rpc SystemOp (SystemOpRequest) returns (SystemOpResult);

  // --- Privacy / Maintenance curtain (blank remote screen & block physical input). ---
  rpc SetPrivacyMode (PrivacyModeRequest) returns (ClipboardAck);

  // --- Initial 2FA TOTP pairing (pins the Controller's unique SHA-256 fingerprint). ---
  rpc PairWith2Fa (PairRequest) returns (PairResult);

  // --- Winget package installs/upgrades. winget.exe is run directly (no shell); package IDs
  // are strictly validated and the whole request is rejected if any ID is invalid. Progress is
  // streamed per package. Windows only (the Linux agent returns UNIMPLEMENTED). ---
  rpc RunWinget (WingetRequest) returns (stream WingetProgress);

  // --- File manager. Absolute local paths only (no UNC / device paths / alternate data
  // streams). Every operation is written to the agent's audit log. Errors are returned as
  // gRPC status codes (INVALID_ARGUMENT, NOT_FOUND, ALREADY_EXISTS, PERMISSION_DENIED,
  // FAILED_PRECONDITION, RESOURCE_EXHAUSTED). ---
  rpc ListDrives (Empty) returns (DriveList);
  rpc ListDirectory (ListDirectoryRequest) returns (DirectoryListing);
  // 256 KB chunks; every chunk carries total_size.
  rpc DownloadFile (FilePathRequest) returns (stream FileChunk);
  // The first chunk must carry destination_path (+ overwrite). Written to a temp file in the
  // destination directory, then moved into place. Max 4 GB.
  rpc UploadFile (stream FileUploadChunk) returns (FileOpResult);
  rpc DeletePath (DeletePathRequest) returns (FileOpResult);
  rpc RenamePath (RenamePathRequest) returns (FileOpResult);
  rpc CreateDirectory (FilePathRequest) returns (FileOpResult);

  // --- Live telemetry: one sample every interval_ms (clamped 1000-10000 ms). ---
  rpc GetTelemetry (TelemetryRequest) returns (stream TelemetrySample);

  // --- Update All: upgrade every installed package (Windows: winget upgrade --all; Linux: the
  // distribution's package manager). Streams one Queued row per package, per-package phases,
  // raw output lines (log_line) and a final message (package_id "", done = true) with the overall
  // exit code. Cancelling the call kills the whole process tree. One run at a time per agent. ---
  rpc UpgradeAll (UpgradeAllRequest) returns (stream WingetProgress);
}

// ---------------- Winget ----------------
message WingetRequest {
  repeated string package_ids = 1;   // each must match ^[A-Za-z0-9][A-Za-z0-9.\-_+]{0,127}$
  bool silent = 2;                   // --silent
  bool machine_scope = 3;            // --scope machine (omitted = winget default scope)
  bool upgrade_if_installed = 4;     // try "upgrade" first, fall back to "install" if not installed
  optional string version = 5;       // exact version; only allowed with a single package id
}

enum WingetPhase {
  WINGET_PHASE_QUEUED = 0;
  WINGET_PHASE_DOWNLOADING = 1;
  WINGET_PHASE_INSTALLING = 2;
  WINGET_PHASE_SUCCEEDED = 3;
  WINGET_PHASE_FAILED = 4;
  WINGET_PHASE_SKIPPED = 5;          // already installed / no applicable upgrade
}

message WingetProgress {
  string package_id = 1;
  WingetPhase phase = 2;
  int32 percent = 3;                 // 0-100 parsed from winget output, -1 when unknown
  string log_line = 4;               // one line of winget output (empty for pure progress updates)
  int32 exit_code = 5;               // winget exit code (HRESULT as signed int); set on terminal phases
  string exit_message = 6;           // readable meaning of exit_code
  bool done = 7;                     // true on the very last message of the stream (all packages processed)
}

message UpgradeAllRequest {
  bool include_unknown = 1;          // winget --include-unknown (packages whose installed version is unknown)
  bool silent = 2;                   // winget --silent (Linux runs are always non-interactive)
}

// ---------------- File manager ----------------
message DriveEntry {
  string name = 1;                   // "C:\" or "/" / mount point
  string label = 2;
  string drive_type = 3;             // Fixed | Removable | Network | CDRom ...
  string format = 4;                 // NTFS, ext4 ...
  int64 total_bytes = 5;
  int64 free_bytes = 6;
  bool is_ready = 7;
}

message DriveList {
  repeated DriveEntry drives = 1;
}

message ListDirectoryRequest {
  string path = 1;
  int32 max_entries = 2;             // 0 = default (10000); clamped to 1-10000
}

message FileEntry {
  string name = 1;
  string full_path = 2;
  bool is_dir = 3;
  int64 size = 4;                    // bytes (0 for directories)
  int64 modified_unix_ms = 5;        // last write time (UTC, Unix ms)
  string attributes = 6;             // e.g. "ReadOnly, Hidden"
  bool is_link = 7;                  // symlink / junction / reparse point
}

message DirectoryListing {
  string path = 1;                   // normalized full path that was listed
  string parent_path = 2;            // empty at a root
  repeated FileEntry entries = 3;    // directories first, then files, each sorted by name
  bool truncated = 4;                // more entries existed than max_entries
}

message FilePathRequest {
  string path = 1;
}

message FileChunk {
  bytes data = 1;
  int64 offset = 2;                  // offset of this chunk in the file
  int64 total_size = 3;              // total file size in bytes
  string file_name = 4;              // set on the first chunk
}

message FileUploadChunk {
  string destination_path = 1;       // required on the first chunk
  bool overwrite = 2;                // first chunk only
  bytes data = 3;
  int64 total_size = 4;              // optional size hint (first chunk); checked against the cap up front
}

message DeletePathRequest {
  string path = 1;
  bool recursive = 2;                // required to delete a non-empty directory
}

message RenamePathRequest {
  string source_path = 1;
  string destination_path = 2;       // full destination path (may be in another directory = move)
  bool overwrite = 3;                // files only
}

message FileOpResult {
  bool success = 1;
  string message = 2;
  string path = 3;                   // resulting normalized path
  int64 bytes = 4;                   // bytes written (UploadFile)
}

// ---------------- Telemetry ----------------
message TelemetryRequest {
  int32 interval_ms = 1;             // clamped to 1000-10000
}

message TelemetrySample {
  double cpu_percent = 1;            // 0-100, all cores
  int64 mem_total_bytes = 2;
  int64 mem_used_bytes = 3;
  repeated DiskInfo disks = 4;       // fixed disks only
  double net_rx_bytes_per_sec = 5;
  double net_tx_bytes_per_sec = 6;
  int64 uptime_seconds = 7;
  int32 process_count = 8;
  int64 timestamp_unix_ms = 9;
}

message PairRequest {
  string totp_code = 1;
  string controller_name = 2;
}

message PairResult {
  bool success = 1;
  string message = 2;
}

message PrivacyModeRequest {
  bool enabled = 1;
  string banner_text = 2;
}

message SystemOpRequest {
  string area = 1;    // services | updates | startup | tasks | power | registry | firewall | system
  string action = 2;  // allowlisted action id, e.g. "list", "restart", "install-all"
  string target = 3;  // service name / KB / registry path / task path ...
  string extra = 4;   // secondary argument (startup type, days, "name|type|value" ...)
}

message SystemOpResult {
  bool success = 1;
  string message = 2;
  string json_data = 3;     // JSON array/object for tabular results
  bool is_elevated = 4;     // whether the agent runs with administrator rights
}

message Empty {}

message AgentInfo {
  string machine_name = 1;
  string os_version = 2;
  string agent_version = 3;
  string logged_in_user = 4;
  int32 primary_screen_width = 5;
  int32 primary_screen_height = 6;
  int32 monitor_count = 7;
}

// ---------------- Inventory ----------------
message InventorySnapshot {
  repeated InstalledApp apps = 1;
  repeated RunningProcess processes = 2;
  HardwareInfo hardware = 3;
  string collected_at_utc = 4;
}

message InstalledApp {
  string name = 1;
  string version = 2;
  string publisher = 3;
  string install_date = 4;
}

message RunningProcess {
  int32 pid = 1;
  string name = 2;
  int64 working_set_bytes = 3;
}

message HardwareInfo {
  string cpu = 1;
  int32 logical_cores = 2;
  int64 total_ram_bytes = 3;
  string gpu = 4;
  repeated DiskInfo disks = 5;
}

message DiskInfo {
  string name = 1;
  int64 total_bytes = 2;
  int64 free_bytes = 3;
}

// ---------------- Shell ----------------
message ShellInput {
  string data = 1;       // text typed into the shell (command + newline)
  bool close = 2;        // request graceful shutdown of the shell
}

message ShellOutput {
  string data = 1;       // stdout/stderr text
  bool is_error = 2;
}

// ---------------- Screen ----------------
message ScreenRequest {
  int32 fps = 1;             // requested frames per second (clamped agent-side)
  int32 quality = 2;         // JPEG quality 1-100
  string operator_name = 3;  // shown in the agent's consent prompt + banner
  int32 max_width = 4;       // optional max frame width for faster streaming (0 = native)
  bool supports_tiles = 5;   // controller can apply partial (dirty-tile) frames
  int32 monitor_index = 6;   // 0 = primary monitor, 1+ = secondary monitors
  // LAN quality options (older agents ignore them; 0 / false keeps the original behaviour):
  int32 chroma = 7;           // JPEG chroma: 0 = agent default (4:4:4 on Windows), 1 = 4:2:0, 2 = 4:4:4
  bool lossless_refine = 8;   // tile streams: regions that stay still are re-sent losslessly as PNG tiles
  int32 refine_delay_ms = 9;  // how long a region must be still before it is refined (0 = agent default)
}

// A changed rectangle of the remote screen, encoded at its own size.
message ScreenTile {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  bytes jpeg = 5;     // the encoded image: JPEG when format = 0, PNG when format = 1 (name kept for compatibility)
  int32 format = 6;   // 0 = JPEG, 1 = PNG (lossless refine; only sent when the request set lossless_refine)
}

// Remote mouse pointer (sent with tile frames; the pointer is not drawn into the tiles).
message ScreenCursor {
  bool visible = 1;
  int32 x = 2;              // pointer hotspot position in frame pixels
  int32 y = 3;
  bytes shape_png = 4;      // only set when the shape changed (32-bit PNG with alpha)
  int32 hotspot_x = 5;
  int32 hotspot_y = 6;
  int64 shape_id = 7;       // changes whenever the shape changes
}

// Either a full frame (jpeg set) or, for controllers that sent supports_tiles,
// a partial update: tiles to draw on top of the previous image (jpeg empty).
message ScreenFrame {
  bytes jpeg = 1;
  int32 width = 2;
  int32 height = 3;
  int64 sequence = 4;
  repeated ScreenTile tiles = 5;
  ScreenCursor cursor = 6;
  int64 capture_unix_ms = 7;   // agent clock when the frame was captured
}

// ---------------- Input ----------------
message InputEvent {
  enum Kind {
    MOUSE_MOVE = 0;
    MOUSE_DOWN = 1;
    MOUSE_UP = 2;
    MOUSE_WHEEL = 3;
    KEY_DOWN = 4;
    KEY_UP = 5;
  }
  Kind kind = 1;
  // Mouse: normalized 0..65535 absolute coordinates.
  int32 x = 2;
  int32 y = 3;
  int32 button = 4;   // 0=left 1=right 2=middle
  int32 wheel = 5;    // wheel delta
  int32 key_code = 6; // virtual key code
}

message InputAck {
  int64 events_applied = 1;
}

// ---------------- Silent Software Deployment ----------------
message PackageChunk {
  string file_name = 1;        // e.g. "setup.exe" or "app.msi" (sent on first chunk)
  string arguments = 2;        // silent arguments; empty = auto-detect silent flags
  bytes data = 3;              // raw file chunk bytes
  int32 timeout_seconds = 4;   // max install wait time (default 300s)
}

message DeployResult {
  bool success = 1;
  int32 exit_code = 2;
  string command_line = 3;
  string output = 4;
}

// ---------------- Process Control ----------------
message KillProcessRequest {
  int32 pid = 1;
}

message KillProcessResult {
  bool success = 1;
  string message = 2;
}

// ---------------- Clipboard Sync ----------------
message ClipboardFile {
  string file_name = 1;
  bytes data = 2;
}

message ClipboardData {
  string text = 1;
  repeated ClipboardFile files = 2;
}

message ClipboardAck {
  bool success = 1;
}
